<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manager sign-in · Whin Scaur</title>
  </head>
  <body style="--accent: #2f7d4f" data-role="manager" hidden>
    <header><span class="mark">Whin Scaur</span><span class="badge">Manager</span></header>
    <main class="signin">
      <h1>Manager sign-in</h1>
      <p>For the people who manage Whin Scaur's list.</p>
      <form id="signin">
        <label>Email <input name="email" type="email" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="error" class="error" role="alert" hidden></p>
        <button type="submit">Sign in</button>
      </form>
    </main>
    <footer>Whin Scaur · a test site for Impeccable reviews</footer>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
